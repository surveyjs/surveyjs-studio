# Offline replica of the legacy stores: Azurite (Blob and Table) and SQL Server.
# Start with `pnpm demo:azurite:up`; stop and wipe with `pnpm demo:azurite:down`.
name: my-surveys-legacy
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(10002,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  legacy-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU24-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${LEGACY_SQL_SA_PASSWORD:?set LEGACY_SQL_SA_PASSWORD (see docker/azurite.env)}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - legacy-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Local OpenID provider standing in for auth.surveyjs.io. Issuer: http://127.0.0.1:18080/surveyjs.
  # Its login page signs in whoever is typed; mock-oidc.json maps the fixture users (owner, admin,
  # member, outsider, blocked, or their ids) to their legacy ids, emails and names.
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.3
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./mock-oidc.json:/config/mock-oidc.json:ro
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/isalive"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  azurite-data:
  legacy-sql-data:
