name: Copy image tags

# One-off, for the package rename of 2026-11-12 (ADR 0028): the hosted image moved from
# ghcr.io/surveyjs/surveyjs-studio to ghcr.io/surveyjs/surveyjs-studio-hosted, and self-hosted
# releases moved from ghcr.io/surveyjs/surveyjs-studio-selfhosted-test to ghcr.io/surveyjs/surveyjs-studio.
# Run it once (Actions › Copy image tags › Run workflow) before the server's IMAGE changes. It copies
#   - the commit that :production names in the old hosted package, as that commit id and as
#     :production, so the server keeps running it after the switch and can roll back to it;
#   - the last release, v0.7.0-rc.4, so the next release's upgrade check finds a previous image.
# Copying is by digest: the images are the same, only the names are new. Running it again is safe.
# Delete this file once the server runs from surveyjs-studio-hosted.
on:
  workflow_dispatch:

permissions:
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://studio.surveyjs.io
    env:
      OLD_HOSTED: ghcr.io/surveyjs/surveyjs-studio
      NEW_HOSTED: ghcr.io/surveyjs/surveyjs-studio-hosted
      OLD_RELEASES: ghcr.io/surveyjs/surveyjs-studio-selfhosted-test
      NEW_RELEASES: ghcr.io/surveyjs/surveyjs-studio
      RELEASES: v0.7.0-rc.4
    steps:
      - name: Sign in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: The production image
        run: |
          docker pull -q "$OLD_HOSTED:production" >/dev/null
          sha="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$OLD_HOSTED:production")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$OLD_HOSTED:production has no commit id in its revision label"; exit 1; }
          docker buildx imagetools create --tag "$NEW_HOSTED:$sha" --tag "$NEW_HOSTED:production" "$OLD_HOSTED:$sha"
          echo "$NEW_HOSTED:production and :$sha are now $OLD_HOSTED:$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: The releases
        run: |
          for tag in $RELEASES; do
            docker buildx imagetools create --tag "$NEW_RELEASES:$tag" "$OLD_RELEASES:$tag"
            echo "$NEW_RELEASES:$tag is now $OLD_RELEASES:$tag" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io
