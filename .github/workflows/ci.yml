name: CI

on:
  push:
    branches: [master, "step/**", "self-hosted/**", "hosted/**"]
  pull_request:
  # A manual run (Actions › CI › Run workflow); on master it publishes, as a push does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency check
        run: pnpm check:deps

      - name: Contract lint
        run: pnpm lint:contract

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Conformance tests (in-memory)
        run: pnpm test:conformance

      - name: Conformance tests (in-memory, READ_ONLY=true)
        run: pnpm test:conformance:read-only

      - name: Conformance tests (SQLite, a new database file)
        run: pnpm test:conformance:sqlite

      # The Azurite conformance run and both end-to-end runs use this image (docker run --network host).
      - name: Build the production image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t surveyjs-studio:ci .

      - name: Start the legacy replica and the mock OIDC server (Azurite, SQL Server, mock-oauth2-server)
        run: pnpm demo:azurite:up

      - name: Provider suite (Azurite)
        run: pnpm test:providers:azurite

      - name: Start PostgreSQL
        run: pnpm postgres:up

      - name: Provider and migrator suites (PostgreSQL)
        run: pnpm test:providers:postgres

      # RustFS, an S3-compatible server, for FILE_STORE=s3 (the e2e PostgreSQL mode uses it too).
      - name: Start the local S3 server (RustFS)
        run: pnpm s3:up

      - name: Byte store and provider suites (files in S3)
        run: pnpm test:providers:s3

      - name: Conformance tests (SQLite, files in S3)
        run: pnpm test:conformance:s3

      - name: Conformance tests (PostgreSQL, on the image)
        run: pnpm test:conformance:postgres
        env:
          CONFORMANCE_IMAGE: surveyjs-studio:ci

      - name: Conformance tests (Azure legacy on Azurite, on the image)
        run: pnpm test:conformance:azurite
        env:
          CONFORMANCE_IMAGE: surveyjs-studio:ci

      # The download sometimes hangs: fail fast, so a re-run starts soon.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm --filter @surveyjs-studio/e2e exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (on the image)
        run: pnpm e2e
        env:
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio:ci

      - name: End-to-end tests (Azurite mode, on the image)
        run: pnpm e2e:azurite
        env:
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio:ci

      # The tsx server: its SQLite file is on the host (no image target).
      - name: End-to-end tests (SQLite mode)
        run: pnpm e2e:sqlite

      # The tsx server on a new database of the PostgreSQL started above, files in a new S3 bucket.
      - name: End-to-end tests (PostgreSQL mode)
        run: pnpm e2e:postgres

      # Only a push or a manual run on master publishes; the publish job pushes this same, tested image.
      - name: Save the image for the publish job
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: docker save surveyjs-studio:ci | gzip > surveyjs-studio-image.tar.gz

      - name: Upload the image for the publish job
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveyjs-studio-image
          path: surveyjs-studio-image.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # The suites save each app container's log to docker-logs/ when they remove it; this adds the
      # app containers still there (a server that failed to start).
      - name: Collect the app container logs
        if: failure()
        run: |
          mkdir -p docker-logs
          for name in $(docker ps -a --filter name=surveyjs-studio-e2e --filter name=surveyjs-studio-conformance --format '{{.Names}}'); do
            docker logs "$name" > "docker-logs/$name.log" 2>&1 || true
          done

      - name: Upload the app container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs
          path: docker-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the legacy replica
        if: always()
        run: pnpm demo:azurite:down

      - name: Stop PostgreSQL
        if: always()
        run: pnpm postgres:down

      - name: Stop the local S3 server
        if: always()
        run: pnpm s3:down

  # Pushes the image the ci job tested to ghcr.io/surveyjs/surveyjs-studio:<commit sha>. It runs no
  # third-party code, so only this job gets write access to packages.
  publish:
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/surveyjs/surveyjs-studio
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surveyjs-studio-image

      - name: Load the image
        run: gunzip -c surveyjs-studio-image.tar.gz | docker load

      - name: Check that no settings file is in the image
        run: |
          found="$(docker run --rm --entrypoint sh surveyjs-studio:ci -c 'find /app -name "*.env*"')"
          if [ -n "$found" ]; then
            echo "::error::settings files in the image: $found"
            exit 1
          fi

      - name: Push to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag surveyjs-studio:ci "$IMAGE:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          echo "Pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
