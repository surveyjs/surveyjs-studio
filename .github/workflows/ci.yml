name: CI

on:
  push:
    branches: [master, "step/**", "self-hosted/**", "hosted/**"]
  pull_request:
  # A manual run (Actions › CI › Run workflow); on master it publishes, as a push does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The jobs run side by side, each on its own runner (so no two suites share a port). The image is
# built once, by `image`, and the jobs that test it load that artifact. `ci` passes only when every
# job before it passed; `publish` waits for it.
jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Dependency check
        run: pnpm check:deps

      - name: Contract lint
        run: pnpm lint:contract

      - name: Type-check
        run: pnpm typecheck

      - name: Example shell in the shells guide
        run: pnpm check:example-shell

      - name: Links in the docs
        run: pnpm check:docs-links

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  unit:
    name: Unit and in-process conformance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test:unit

      - name: Conformance tests (in-memory)
        run: pnpm test:conformance

      - name: Conformance tests (in-memory, READ_ONLY=true)
        run: pnpm test:conformance:read-only

      - name: Conformance tests (SQLite, a new database file)
        run: pnpm test:conformance:sqlite

      - name: Conformance tests (SQLite, local accounts and password sign-in)
        run: pnpm test:conformance:password

      - name: Conformance tests (SQLite, OAuth2 sign-in against the OAuth stub)
        run: pnpm test:conformance:oauth

      - name: Conformance tests (sandbox mock, msw/node)
        run: pnpm test:conformance:sandbox

  # The production image, saved for the jobs that run suites on it (docker run --network host) and,
  # on master, for the publish job.
  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t surveyjs-studio:ci .

      - name: Save the image
        run: docker save surveyjs-studio:ci | gzip -1 > surveyjs-studio-image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveyjs-studio-image
          path: surveyjs-studio-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  azurite:
    name: Azure legacy suites (Azurite)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start the legacy replica and the mock OIDC server (Azurite, SQL Server, mock-oauth2-server)
        run: pnpm demo:azurite:up

      - name: Provider suite (Azurite)
        run: pnpm test:providers:azurite

      - name: Conformance tests (Azure legacy on Azurite, on the image)
        run: pnpm test:conformance:azurite
        env:
          CONFORMANCE_IMAGE: surveyjs-studio:ci

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      - name: End-to-end tests (Azurite mode, on the image)
        run: pnpm e2e:azurite
        env:
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio:ci

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: azurite

      - name: Stop the legacy replica
        if: always()
        run: pnpm demo:azurite:down

  # The production image with production's settings (mode 1: docker/prod-like.env, NODE_ENV=production),
  # on the replica and the mock OIDC server. The other suites run the image in test or development
  # mode, so only this job sees the start-up checks refuse a production configuration.
  prod-like:
    name: Prod-like (the image with production's settings)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_LIKE_IMAGE: surveyjs-studio:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start the image with docker/prod-like.env as it is
        run: docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml up -d --wait --no-build

      - name: Check that it started in mode 1
        run: |
          line="$(docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml logs --no-log-prefix app | grep '"msg":"starting"' | tail -n 1)"
          echo "$line"
          for want in '"edition":"hosted"' '"shell":"surveyjs-site"' '"storageProvider":"azure-legacy"' \
            '"userDirectory":"surveyjs-sql"' '"identityProvider":"surveyjs-oidc"' \
            '"accountNotices":"surveyjs-licenses"' '"readOnly":false' '"nodeEnv":"production"'; do
            [[ "$line" == *"$want"* ]] || { echo "::error::the starting line lacks $want"; exit 1; }
          done

      # /readyz answers 503 until the fixtures have created the replica's database.
      - name: Load the fixtures, then check that the app is ready
        run: |
          pnpm legacy:load
          curl -fsS http://localhost:8080/readyz

      - name: Restart the app with the e2e settings (docker/compose.prod-like.e2e.yaml)
        run: docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml -f docker/compose.prod-like.e2e.yaml up -d --wait --no-build app

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      - name: End-to-end tests (the Azurite mode's specs, on the prod-like stack)
        run: pnpm e2e:prod-like

      - name: Save the app's log
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml logs app > docker-logs/prod-like-app.log 2>&1 || true

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: prod-like

      - name: Stop the prod-like stack
        if: always()
        run: pnpm prod-like:down

  postgres:
    name: PostgreSQL and S3 suites
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start PostgreSQL
        run: pnpm postgres:up

      - name: Provider and migrator suites (PostgreSQL)
        run: pnpm test:providers:postgres

      # RustFS, an S3-compatible server, for FILE_STORE=s3 (the e2e PostgreSQL mode uses it too).
      - name: Start the local S3 server (RustFS)
        run: pnpm s3:up

      - name: Byte store and provider suites (files in S3)
        run: pnpm test:providers:s3

      - name: Conformance tests (SQLite, files in S3)
        run: pnpm test:conformance:s3

      - name: Conformance tests (PostgreSQL, on the image)
        run: pnpm test:conformance:postgres
        env:
          CONFORMANCE_IMAGE: surveyjs-studio:ci

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      # The tsx server on a new database of the PostgreSQL started above, files in a new S3 bucket.
      - name: End-to-end tests (PostgreSQL mode)
        run: pnpm e2e:postgres

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: postgres

      - name: Stop PostgreSQL
        if: always()
        run: pnpm postgres:down

      - name: Stop the local S3 server
        if: always()
        run: pnpm s3:down

  # The conformance suite against a running server, as a port's author runs it.
  # The commands of docs/customizing/porting.md; keep them the same.
  conformance-base:
    name: Conformance tests against the image (--base)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Write the reference settings and start the image
        run: |
          node --import tsx scripts/conformance/cli.ts reference-env --port 3000 --out ref.env
          docker run -d --name reference --network host --env-file ref.env -e NODE_ENV=development surveyjs-studio:ci

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The server was not ready after 60 s" >&2
          exit 1

      - name: Conformance tests against the running image
        run: |
          export CONFORMANCE_WEBHOOK_SECRET="$(grep '^ACCOUNT_WEBHOOK_SECRET=' ref.env | cut -d= -f2-)"
          pnpm test:conformance --base http://127.0.0.1:3000

      - name: Save the server log
        if: failure()
        run: |
          mkdir -p docker-logs
          docker logs reference > docker-logs/reference.log 2>&1 || true

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs-conformance-base
          path: docker-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the server
        if: always()
        run: docker rm -f reference

  # The memory provider and the dev sign-in, on the image: one browser per runner.
  e2e-image:
    name: End-to-end tests on the image (${{ matrix.browser }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}

      - name: End-to-end tests (on the image)
        run: pnpm e2e --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio:ci

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: image-${{ matrix.browser }}

  # The tsx server (or, for the sandbox, `vite preview`) on Chromium: no image and no services.
  e2e-modes:
    name: End-to-end tests (SQLite, password, OAuth, self-hosted, sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      # The tsx server: its SQLite file is on the host (no image target).
      - name: End-to-end tests (SQLite mode)
        run: pnpm e2e:sqlite

      # The tsx server on a new SQLite file, signing in with passwords on the app's own page.
      - name: End-to-end tests (password mode)
        run: pnpm e2e:password

      # The same, plus GitHub and Google sign-in against the OAuth stub (port 5180).
      - name: End-to-end tests (OAuth mode)
        run: pnpm e2e:oauth

      # The tsx server on a new SQLite file, in the self-hosted shell with an instance's branding.
      - name: End-to-end tests (self-hosted mode)
        run: pnpm e2e:self-hosted

      # The sandbox build (the web app with its in-browser mock back-end), served by `vite preview`.
      - name: End-to-end tests (sandbox mode)
        run: pnpm e2e:sandbox

      # The same build for the sub-path /studio/ (SANDBOX_BASE), served only there: no request may leave it.
      - name: End-to-end tests (sandbox on a sub-path)
        run: pnpm e2e:sandbox:subpath

      # The user-story specs on the same build; their API set-up runs in the page, so the mock answers it.
      - name: End-to-end tests (user stories on the sandbox)
        run: pnpm e2e:sandbox:stories

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: modes

  # Gitleaks over the history reachable from the checked-out commit (--log-opts=HEAD). Without --log-opts it would
  # scan every ref the clone has, i.e. every upstream branch and tag. Keep the image reference (tag and digest) in
  # step with scripts/secrets-scan/args.ts.
  # Reviewed findings are listed in .gitleaksignore; the record is docs/operations/going-public.md.
  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container user differs from the runner's, so it runs as the runner's user to read the checkout.
      - name: Scan the history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro"             zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176             git /repo --log-opts=HEAD --redact             --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner

  # The one result to wait for: it fails when any job above failed, was cancelled or was skipped.
  ci:
    name: ci
    needs:
      [
        checks,
        unit,
        image,
        azurite,
        prod-like,
        postgres,
        e2e-image,
        e2e-modes,
        secrets,
        conformance-base,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  # The self-hosted image (--target self-hosted): the image checks and the SQLite, password and
  # self-hosted e2e suites on it. It runs next to ci; nothing publishes it here (release.yml does).
  self-hosted-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/self-hosted-image.yml
    with:
      image-tag: ${{ github.sha }}

  # Pushes the image the ci job tested to ghcr.io/surveyjs/surveyjs-studio:<commit sha>. It runs no
  # third-party code, so only this job gets write access to packages.
  publish:
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/surveyjs/surveyjs-studio
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surveyjs-studio-image

      - name: Load the image
        run: gunzip -c surveyjs-studio-image.tar.gz | docker load

      # Inline rather than `pnpm image:checks --only secrets`: that needs a checkout and an install,
      # i.e. third-party code in the one job that can write packages.
      - name: Check that no settings file is in the image
        run: |
          found="$(docker run --rm --entrypoint sh surveyjs-studio:ci -c 'find /app -name "*.env*"')"
          if [ -n "$found" ]; then
            echo "::error::settings files in the image: $found"
            exit 1
          fi

      - name: Push to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag surveyjs-studio:ci "$IMAGE:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          echo "Pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
