name: CI

on:
  push:
    branches: [master, "step/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency check
        run: pnpm check:deps

      - name: Contract lint
        run: pnpm lint:contract

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Conformance tests (in-memory)
        run: pnpm test:conformance

      - name: Conformance tests (in-memory, READ_ONLY=true)
        run: pnpm test:conformance:read-only

      # The Azurite conformance run and both end-to-end runs use this image (docker run --network host).
      - name: Build the production image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t my-surveys:ci .

      - name: Start the legacy replica and the mock OIDC server (Azurite, SQL Server, mock-oauth2-server)
        run: pnpm demo:azurite:up

      - name: Provider suite (Azurite)
        run: pnpm test:providers:azurite

      - name: Conformance tests (Azure legacy on Azurite, on the image)
        run: pnpm test:conformance:azurite
        env:
          CONFORMANCE_IMAGE: my-surveys:ci

      - name: Install Playwright browsers
        run: pnpm --filter @my-surveys/e2e exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (on the image)
        run: pnpm e2e
        env:
          E2E_TARGET: image
          E2E_IMAGE: my-surveys:ci

      - name: End-to-end tests (Azurite mode, on the image)
        run: pnpm e2e:azurite
        env:
          E2E_TARGET: image
          E2E_IMAGE: my-surveys:ci

      # Only a push to master publishes; the publish job pushes this same, tested image.
      - name: Save the image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save my-surveys:ci | gzip > my-surveys-image.tar.gz

      - name: Upload the image for the publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: my-surveys-image
          path: my-surveys-image.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # The suites save each app container's log to docker-logs/ when they remove it; this adds the
      # app containers still there (a server that failed to start).
      - name: Collect the app container logs
        if: failure()
        run: |
          mkdir -p docker-logs
          for name in $(docker ps -a --filter name=my-surveys-e2e --filter name=my-surveys-conformance --format '{{.Names}}'); do
            docker logs "$name" > "docker-logs/$name.log" 2>&1 || true
          done

      - name: Upload the app container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs
          path: docker-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the legacy replica
        if: always()
        run: pnpm demo:azurite:down

  # Pushes the image the ci job tested to ghcr.io/surveyjs/my-surveys:<commit sha>. It runs no
  # third-party code, so only this job gets write access to packages.
  publish:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/surveyjs/my-surveys
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: my-surveys-image

      - name: Load the image
        run: gunzip -c my-surveys-image.tar.gz | docker load

      - name: Check that no settings file is in the image
        run: |
          found="$(docker run --rm --entrypoint sh my-surveys:ci -c 'find /app -name "*.env*"')"
          if [ -n "$found" ]; then
            echo "::error::settings files in the image: $found"
            exit 1
          fi

      - name: Push to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag my-surveys:ci "$IMAGE:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          echo "Pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
