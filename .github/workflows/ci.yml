name: CI

on:
  push:
    branches: [master, production, "step/**", "self-hosted/**", "hosted/**"]
  pull_request:
  # A manual run (Actions › CI › Run workflow); on master and production it publishes, as a push does.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/production' }}

# The jobs run side by side, each on its own runner (so no two suites share a port). The image is
# built once, by `image`, and the jobs that test it load that artifact. `ci` passes only when every
# job before it passed; `publish` waits for it.
jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Dependency check
        run: pnpm check:deps

      - name: Contract lint
        run: pnpm lint:contract

      - name: Type-check
        run: pnpm typecheck

      - name: Example shell in the shells guide
        run: pnpm check:example-shell

      - name: Links in the docs
        run: pnpm check:docs-links

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  unit:
    name: Unit and in-process conformance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test:unit

      - name: Conformance tests (in-memory)
        run: pnpm test:conformance

      - name: Conformance tests (in-memory, READ_ONLY=true)
        run: pnpm test:conformance:read-only

      - name: Conformance tests (SQLite, a new database file)
        run: pnpm test:conformance:sqlite

      - name: Conformance tests (SQLite, local accounts and password sign-in)
        run: pnpm test:conformance:password

      - name: Conformance tests (SQLite, OAuth2 sign-in against the OAuth stub)
        run: pnpm test:conformance:oauth

      - name: Conformance tests (sandbox mock, msw/node)
        run: pnpm test:conformance:sandbox

      # The bridge in front of in-memory Studio, against the derived golden files, and the Form
      # Library v1 in jsdom; forwarded paths go to a local stub, never the old service.
      - name: Legacy API compatibility tests (the bridge on in-memory Studio)
        run: pnpm test:compat

  # The production image, saved for the jobs that run suites on it (docker run --network host) and,
  # on master, for the publish job.
  image:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t surveyjs-studio-hosted:ci .

      # The bridge's image (its tests run in the unit job); it shares the build stage built above.
      - name: Build the bridge image
        run: docker build --target bridge --label "org.opencontainers.image.revision=$GITHUB_SHA" -t surveyjs-studio-bridge:ci .

      # The image starts, and forwards a path it has no action for to the "old service" (here a
      # static file server, on the runner).
      - name: Check that the bridge image starts and forwards
        run: |
          mkdir -p bridge-smoke && echo "old service" > bridge-smoke/index.html
          python3 -m http.server 3009 --bind 127.0.0.1 --directory bridge-smoke > /dev/null 2>&1 &
          docker run -d --name bridge --network host \
            -e BRIDGE_STUDIO_URL=http://127.0.0.1:3000/api/v1 -e BRIDGE_LEGACY_URL=http://127.0.0.1:3009 \
            -e BRIDGE_METRICS_PORT=9465 \
            surveyjs-studio-bridge:ci
          ok=""
          for i in $(seq 1 30); do
            if body="$(curl -fsS http://127.0.0.1:3002/)"; then
              echo "$body"
              test "$body" = "old service" || { docker logs bridge >&2; exit 1; }
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "The bridge did not answer within 30 s" >&2
            docker logs bridge >&2
            exit 1
          fi
          # The metrics listener answers, and the caller summary command is in the image.
          metrics="$(curl -fsS http://127.0.0.1:9465/metrics)"
          echo "$metrics" | grep -q '^surveyjs_bridge_' || { echo "No surveyjs_bridge_ metrics" >&2; exit 1; }
          header="$(printf '' | docker exec -i bridge bridge-callers)"
          test "$header" = "day,key,action,count,first,last" || { echo "bridge-callers printed: $header" >&2; exit 1; }

      - name: Stop the bridge
        if: always()
        run: docker rm -f bridge || true

      - name: Save the image
        run: docker save surveyjs-studio-hosted:ci | gzip -1 > surveyjs-studio-hosted-image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveyjs-studio-hosted-image
          path: surveyjs-studio-hosted-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Save the bridge image
        run: docker save surveyjs-studio-bridge:ci | gzip -1 > surveyjs-studio-bridge-image.tar.gz

      - name: Upload the bridge image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surveyjs-studio-bridge-image
          path: surveyjs-studio-bridge-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  azurite:
    name: Azure legacy suites (Azurite)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start the legacy replica and the mock OIDC server (Azurite, SQL Server, mock-oauth2-server)
        run: pnpm demo:azurite:up

      - name: Provider suite (Azurite)
        run: pnpm test:providers:azurite

      - name: Conformance tests (Azure legacy on Azurite, on the image)
        run: pnpm test:conformance:azurite
        env:
          CONFORMANCE_IMAGE: surveyjs-studio-hosted:ci

      - name: Legacy API compatibility tests (the bridge on Azure legacy, Azurite)
        run: pnpm test:compat:azurite

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      - name: End-to-end tests (Azurite mode, on the image)
        run: pnpm e2e:azurite
        env:
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio-hosted:ci

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: azurite

      - name: Stop the legacy replica
        if: always()
        run: pnpm demo:azurite:down

  # The production image with production's settings (mode 1: docker/prod-like.env, NODE_ENV=production),
  # on the replica and the mock OIDC server. The other suites run the image in test or development
  # mode, so only this job sees the start-up checks refuse a production configuration.
  prod-like:
    name: Prod-like (the image with production's settings)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROD_LIKE_IMAGE: surveyjs-studio-hosted:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start the image with docker/prod-like.env as it is
        run: docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml up -d --wait --no-build

      - name: Check that it started in mode 1
        run: |
          line="$(docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml logs --no-log-prefix app | grep '"msg":"starting"' | tail -n 1)"
          echo "$line"
          for want in '"edition":"hosted"' '"shell":"surveyjs-site"' '"storageProvider":"azure-legacy"' \
            '"userDirectory":"surveyjs-sql"' '"identityProvider":"surveyjs-oidc"' \
            '"accountNotices":"surveyjs-licenses"' '"readOnly":false' '"nodeEnv":"production"'; do
            [[ "$line" == *"$want"* ]] || { echo "::error::the starting line lacks $want"; exit 1; }
          done

      # /readyz answers 503 until the fixtures have created the replica's database.
      - name: Load the fixtures, then check that the app is ready
        run: |
          pnpm legacy:load
          curl -fsS http://localhost:8080/readyz

      - name: Restart the app with the e2e settings (docker/compose.prod-like.e2e.yaml)
        run: docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml -f docker/compose.prod-like.e2e.yaml up -d --wait --no-build app

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      - name: End-to-end tests (the Azurite mode's specs, on the prod-like stack)
        run: pnpm e2e:prod-like

      - name: Save the app's log
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose --env-file docker/azurite.env -f docker/compose.prod-like.yaml logs app > docker-logs/prod-like-app.log 2>&1 || true

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: prod-like

      - name: Stop the prod-like stack
        if: always()
        run: pnpm prod-like:down

  # The new hosted server's profile (docker/prod-like.sql.env, NODE_ENV=production): the image on
  # PostgreSQL with files in S3, and the mock OIDC server. The start-up checks (the storage and the
  # file store are reached, the settings fit the edition) run here as they do on the server; file
  # behaviour on S3 is proven by the conformance suites.
  prod-like-sql:
    name: Prod-like (the new server's settings on PostgreSQL and S3)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROD_LIKE_IMAGE: surveyjs-studio-hosted:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-image

      - name: Start the image with docker/prod-like.sql.env as it is
        run: docker compose --env-file docker/prod-like.sql.env -f docker/compose.prod-like.sql.yaml up -d --wait --no-build

      - name: Check that it started with the new server's settings
        run: |
          line="$(docker compose --env-file docker/prod-like.sql.env -f docker/compose.prod-like.sql.yaml logs --no-log-prefix app | grep '"msg":"starting"' | tail -n 1)"
          echo "$line"
          for want in '"edition":"hosted"' '"storageProvider":"postgres"' '"fileStore":"s3"'             '"historyMaxEntries":20' '"userDirectory":"local"' '"accountNotices":"sign-in-licence"'             '"readOnly":false' '"nodeEnv":"production"'; do
            [[ "$line" == *"$want"* ]] || { echo "::error::the starting line lacks $want"; exit 1; }
          done

      - name: Check that it is ready and answers from PostgreSQL
        run: |
          curl -fsS http://localhost:8081/readyz
          curl -fsS http://localhost:8081/api/v1/config | tee config.json
          grep -q '"edition":"hosted"' config.json
          # An unknown survey: a query reached PostgreSQL and found nothing.
          status="$(curl -sS -o problem.json -w '%{http_code}' http://localhost:8081/api/v1/public/surveys/00000000-0000-4000-8000-000000000001/definition)"
          cat problem.json; echo
          [ "$status" = 404 ] || { echo "::error::expected 404, got $status"; exit 1; }
          grep -q '"status":404' problem.json

      - name: Save the stack's log
        if: failure()
        run: docker compose --env-file docker/prod-like.sql.env -f docker/compose.prod-like.sql.yaml logs

      - name: Stop the stack
        if: always()
        run: docker compose --env-file docker/prod-like.sql.env -f docker/compose.prod-like.sql.yaml down -v

  postgres:
    name: PostgreSQL and S3 suites
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Start PostgreSQL
        run: pnpm postgres:up

      # The hosted edition's conformance run signs in through it (only its OIDC_* settings are used).
      - name: Start the mock OIDC server (mock-oauth2-server)
        run: docker compose --env-file docker/azurite.env -f docker/compose.azurite.yaml up -d --wait mock-oidc

      - name: Provider and migrator suites (PostgreSQL)
        run: pnpm test:providers:postgres

      # RustFS, an S3-compatible server, for FILE_STORE=s3 (the e2e PostgreSQL mode uses it too).
      - name: Start the local S3 server (RustFS)
        run: pnpm s3:up

      - name: Byte store and provider suites (files in S3)
        run: pnpm test:providers:s3

      - name: Conformance tests (SQLite, files in S3)
        run: pnpm test:conformance:s3

      - name: Conformance tests (PostgreSQL, on the image)
        run: pnpm test:conformance:postgres
        env:
          CONFORMANCE_IMAGE: surveyjs-studio-hosted:ci

      - name: Conformance tests (the hosted edition on PostgreSQL, on the image)
        run: pnpm test:conformance:postgres:hosted
        env:
          CONFORMANCE_IMAGE: surveyjs-studio-hosted:ci

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      # The tsx server on a new database of the PostgreSQL started above, files in a new S3 bucket.
      - name: End-to-end tests (PostgreSQL mode)
        run: pnpm e2e:postgres

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: postgres

      - name: Stop PostgreSQL
        if: always()
        run: pnpm postgres:down

      # The only service of compose.azurite.yaml this job started.
      - name: Stop the mock OIDC server
        if: always()
        run: pnpm demo:azurite:down

      - name: Stop the local S3 server
        if: always()
        run: pnpm s3:down

  # The conformance suite against a running server, as a port's author runs it.
  # The commands of docs/customizing/porting.md; keep them the same.
  conformance-base:
    name: Conformance tests against the image (--base)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      - name: Write the reference settings and start the image
        run: |
          node --import tsx scripts/conformance/cli.ts reference-env --port 3000 --out ref.env
          docker run -d --name reference --network host --env-file ref.env -e NODE_ENV=development surveyjs-studio-hosted:ci

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The server was not ready after 60 s" >&2
          exit 1

      - name: Conformance tests against the running image
        run: |
          export CONFORMANCE_WEBHOOK_SECRET="$(grep '^ACCOUNT_WEBHOOK_SECRET=' ref.env | cut -d= -f2-)"
          pnpm test:conformance --base http://127.0.0.1:3000

      - name: Save the server log
        if: failure()
        run: |
          mkdir -p docker-logs
          docker logs reference > docker-logs/reference.log 2>&1 || true

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-logs-conformance-base
          path: docker-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the server
        if: always()
        run: docker rm -f reference

  # The memory provider and the dev sign-in, on the image: one browser per runner.
  e2e-image:
    name: End-to-end tests on the image (${{ matrix.browser }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/load-image

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}

      - name: End-to-end tests (on the image)
        run: pnpm e2e --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
          E2E_TARGET: image
          E2E_IMAGE: surveyjs-studio-hosted:ci

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: image-${{ matrix.browser }}

  # The tsx server (or, for the sandbox, `vite preview`) on Chromium: no image and no services.
  e2e-modes:
    name: End-to-end tests (SQLite, password, OAuth, self-hosted, sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Cached; each attempt is time-limited and retried, because the download sometimes hangs.
      - name: Install Playwright browsers
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: chromium

      # The sandbox's two-tab test (the cross-tab lock) runs on WebKit too.
      - name: Install Playwright WebKit
        timeout-minutes: 17
        uses: ./.github/actions/playwright
        with:
          browser: webkit

      # The tsx server: its SQLite file is on the host (no image target).
      - name: End-to-end tests (SQLite mode)
        run: pnpm e2e:sqlite

      # The tsx server on a new SQLite file, signing in with passwords on the app's own page.
      - name: End-to-end tests (password mode)
        run: pnpm e2e:password

      # The same, plus GitHub and Google sign-in against the OAuth stub (port 5180).
      - name: End-to-end tests (OAuth mode)
        run: pnpm e2e:oauth

      # The hosted edition's sign-in: the surveyjs method against the stub's surveyjs.io (port 5180).
      - name: End-to-end tests (hosted OAuth mode)
        run: pnpm e2e:hosted-oauth

      # The tsx server on a new SQLite file, in the self-hosted shell with an instance's branding.
      - name: End-to-end tests (self-hosted mode)
        run: pnpm e2e:self-hosted

      # The sandbox build (the web app with its in-browser mock back-end), served by `vite preview`.
      - name: End-to-end tests (sandbox mode)
        run: pnpm e2e:sandbox

      # The same build for the sub-path /studio/ (SANDBOX_BASE), served only there: no request may leave it.
      - name: End-to-end tests (sandbox on a sub-path)
        run: pnpm e2e:sandbox:subpath

      # The user-story specs on the same build; their API set-up runs in the page, so the mock answers it.
      - name: End-to-end tests (user stories on the sandbox)
        run: pnpm e2e:sandbox:stories

      - if: failure()
        uses: ./.github/actions/failure-artifacts
        with:
          name: modes

  # Gitleaks over the history reachable from the checked-out commit (--log-opts=HEAD). Without --log-opts it would
  # scan every ref the clone has, i.e. every upstream branch and tag. Keep the image reference (tag and digest) in
  # step with scripts/secrets-scan/args.ts.
  # Reviewed findings are listed in .gitleaksignore; the record is docs/operations/going-public.md.
  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container user differs from the runner's, so it runs as the runner's user to read the checkout.
      - name: Scan the history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro"             zricethezav/gitleaks:v8.24.0@sha256:2bcceac45179b3a91bff11a824d0fb952585b429e54fc928728b1d4d5c3e5176             git /repo --log-opts=HEAD --redact             --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner

  # The one result to wait for: it fails when any job above failed, was cancelled or was skipped.
  ci:
    name: ci
    needs:
      [
        checks,
        unit,
        image,
        azurite,
        prod-like,
        prod-like-sql,
        postgres,
        e2e-image,
        e2e-modes,
        secrets,
        conformance-base,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  # The self-hosted image (--target self-hosted): the image checks and the SQLite, password and
  # self-hosted e2e suites on it. It runs next to ci; nothing publishes it here (release.yml does).
  self-hosted-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/self-hosted-image.yml
    with:
      image-tag: ${{ github.sha }}

  # Pushes the images the ci job tested to ghcr.io/surveyjs/surveyjs-studio-hosted:<commit sha> and
  # ghcr.io/surveyjs/surveyjs-studio-bridge:<commit sha>, for master and for production (today's server until the
  # cutover: fixes only, ADR 0042). It runs no third-party code, so only this job gets write access to packages.
  publish:
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/surveyjs/surveyjs-studio-hosted
      BRIDGE_IMAGE: ghcr.io/surveyjs/surveyjs-studio-bridge
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surveyjs-studio-hosted-image

      - name: Load the image
        run: gunzip -c surveyjs-studio-hosted-image.tar.gz | docker load

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: surveyjs-studio-bridge-image

      - name: Load the bridge image
        run: gunzip -c surveyjs-studio-bridge-image.tar.gz | docker load

      # Inline rather than `pnpm image:checks --only secrets`: that needs a checkout and an install,
      # i.e. third-party code in the one job that can write packages.
      - name: Check that no settings file is in the image
        run: |
          found="$(docker run --rm --entrypoint sh surveyjs-studio-hosted:ci -c 'find /app -name "*.env*"')"
          if [ -n "$found" ]; then
            echo "::error::settings files in the image: $found"
            exit 1
          fi

      - name: Check that no settings file is in the bridge image
        run: |
          found="$(docker run --rm --entrypoint sh surveyjs-studio-bridge:ci -c 'find /app -name "*.env*"')"
          if [ -n "$found" ]; then
            echo "::error::settings files in the bridge image: $found"
            exit 1
          fi

      - name: Push to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag surveyjs-studio-hosted:ci "$IMAGE:$GITHUB_SHA"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag surveyjs-studio-bridge:ci "$BRIDGE_IMAGE:$GITHUB_SHA"
          docker push "$BRIDGE_IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          echo "Pushed $IMAGE:$GITHUB_SHA and $BRIDGE_IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
