# SurveyJS Studio, self-hosted, with PostgreSQL and S3-compatible file storage (RustFS).
# Copy .env.example to .env, fill it in, then run: docker compose -f compose.postgres.yml up -d
# Neither PostgreSQL nor RustFS is published on the host.
# Its own project name: `down -v` here never touches compose.sqlite.yml's volume.
name: surveyjs-studio-postgres
services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveyjs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: surveyjs_studio
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveyjs -d surveyjs_studio"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://127.0.0.1:9000/health || wget -q -O /dev/null http://127.0.0.1:9000/health",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the bucket once, then exits. An existing bucket is fine.
  bucket:
    image: ${SURVEYJS_STUDIO_IMAGE:-ghcr.io/surveyjs/surveyjs-studio-selfhosted-test:latest}
    command: ["surveyjs-studio", "s3-bucket", "create", "surveyjs-studio-files"]
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}

  app:
    image: ${SURVEYJS_STUDIO_IMAGE:-ghcr.io/surveyjs/surveyjs-studio-selfhosted-test:latest}
    restart: unless-stopped
    ports:
      - "${SURVEYJS_STUDIO_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env (the address people open, e.g. https://surveys.example.com)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env (the first administrator)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (the first administrator's one-time password)}
      STORAGE_PROVIDER: postgres
      DATABASE_URL: postgres://surveyjs:${POSTGRES_PASSWORD}@postgres:5432/surveyjs_studio
      FILE_STORE: s3
      S3_BUCKET: surveyjs-studio-files
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:9000
      # Plain http is fine here: the S3 server is reachable only on the Compose network (no published port).
      S3_ALLOW_HTTP: "true"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      # The session secret (/data/session-secret) lives here.
      - surveyjs-studio-data:/data

volumes:
  postgres-data:
  s3-data:
  surveyjs-studio-data:
