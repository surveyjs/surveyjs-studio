# SurveyJS Studio, self-hosted, with SQLite: one container, one volume.
# Copy .env.example to .env, fill it in, then run: docker compose -f compose.sqlite.yml up -d
# Metrics: add --profile monitoring to start Prometheus too (docker compose --profile monitoring up -d).
# Its own project name (compose.postgres.yml has another): the two examples never share a volume.
name: surveyjs-studio
services:
  app:
    image: ${SURVEYJS_STUDIO_IMAGE:-ghcr.io/surveyjs/surveyjs-studio:latest}
    restart: unless-stopped
    ports:
      - "${SURVEYJS_STUDIO_PORT:-8080}:8080"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env (the address people open, e.g. https://surveys.example.com)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env (the first administrator)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (the first administrator's one-time password)}
      # Metrics for Prometheus, on their own port inside the Compose network.
      METRICS_PORT: 9464
    volumes:
      - surveyjs-studio-data:/data

  # Optional, off by default: docker compose --profile monitoring up -d. Reachable only on this machine
  # (127.0.0.1:9090); the app's metrics port (9464) is never published.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  surveyjs-studio-data:
  prometheus-data:
