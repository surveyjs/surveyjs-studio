# The sandbox's site (ADR 0030): the static build in /usr/share/nginx/html, as conf.d/default.conf.

# The run page may be framed by any site; no other page. $request_uri, not $uri: try_files rewrites $uri to /index.html for the SPA fallback.
map $request_uri $sandbox_frame_ancestors {
    ~^/s/   "*";
    default "'none'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Content-hashed files never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/sandbox/security-headers.conf;
    }

    # The settings: a file the operator mounts at /srv/sandbox-config wins over the one in the build.
    location = /sandbox.config.json {
        root /srv/sandbox-config;
        try_files /sandbox.config.json @built_config;
        add_header Cache-Control "no-store";
        include /etc/nginx/sandbox/security-headers.conf;
    }

    location @built_config {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        include /etc/nginx/sandbox/security-headers.conf;
    }

    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/sandbox/security-headers.conf;
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/sandbox/security-headers.conf;
    }

    # The single-page app: any other path is the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/sandbox/security-headers.conf;
    }
}
