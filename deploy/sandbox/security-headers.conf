# The web app's security headers (server/src/web/security-headers.ts, docs/operations.md "The header
# policy"), included in every location: add_header does not inherit into a location that has its own.
# HSTS is always sent: TLS ends at the proxy in front, and the site is only ever served over https.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $sandbox_frame_ancestors" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000" always;
