openapi: 3.1.0
info:
  title: My Surveys API
  version: 1.0.0-draft
  summary: HTTP contract of the My Surveys application (studio.surveyjs.io).
  license:
    name: MIT
    identifier: MIT
  description: |
    This document is the **source of truth** for the My Surveys back-end. Every
    server implementation (the Node.js reference implementation, or a port to .NET,
    PHP and others) must pass the HTTP conformance suite that is generated from
    and checked against this file. See `idea.md` §7.

    ## Conventions

    - **Versioning.** Every path is relative to `/api/v1`.
    - **JSON.** Property names are camelCase. Timestamps are RFC 3339 in UTC.
      IDs are opaque strings; existing surveyjs.io GUIDs are kept unchanged.
    - **Errors.** Every error uses RFC 9457 Problem Details
      (`application/problem+json`). The `code` member is a stable,
      machine-readable identifier; `errors[]` lists validation failures, each
      with a JSON Pointer to the invalid field.
    - **Partial updates.** `PATCH` takes a JSON Merge Patch (RFC 7396) document.
      Requests may send `application/merge-patch+json` or `application/json`.
    - **Concurrent edits.** Large documents (survey definition, theme) return an
      `ETag`. A write must send `If-Match`; a stale value fails with `412`, and a
      missing one with `428`.
    - **Paging.** Lists use opaque cursors: `?limit=&cursor=` returns
      `{ items, nextCursor }`. `nextCursor` is `null` on the last page.
    - **Creation.** `201 Created` carries a `Location` header and the created
      resource.
    - **Downloads.** The format is chosen with the `Accept` header. Because a
      browser download link cannot set headers, a `format` query parameter is
      accepted as an alias.
    - **Authentication.**
      - The web app uses the session cookie `msid`. Requests that change data
        (POST, PUT, PATCH, DELETE) must also send `X-CSRF-Token`, which echoes the
        value of the readable `msid_csrf` cookie (double-submit pattern).
      - Bearer API tokens (`bearerAuth`) arrive in P1.
      - `/public/*` endpoints need no authentication.
    - **Idempotent submissions.** A respondent submission may carry an
      `Idempotency-Key` header. A repeated key returns the original result instead
      of storing a duplicate.
    - **Phasing.** Operations and properties marked `x-phase: P1` are part of the
      contract but are implemented in Phase 2 (P1). Until then a server answers
      them with `501 Not Implemented`, or ignores the marked properties.
servers:
  - url: https://studio.surveyjs.io/api/v1
    description: Hosted (production)
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Session
    description: Sign-in, sign-out and the current user.
  - name: Config
    description: Runtime settings the front-end needs before it renders.
  - name: Admin
    description: The instance admin's user management (self-hosted, local accounts).
  - name: Projects
    description: Projects group surveys and are shared with members.
  - name: Members
    description: Membership and roles inside a project.
  - name: Surveys
    description: Survey records (metadata) and their lifecycle.
  - name: Survey content
    description: The survey definition (SurveyJS JSON) and the theme, edited by Survey Creator.
  - name: Files
    description: Files uploaded from the editor (assets) or by respondents.
  - name: History
    description: Edit history of a survey.
  - name: Results
    description: Collected responses, statistics and exports.
  - name: Views
    description: Saved per-user layout of the results dashboard and table. A layout save does not change the survey.
  - name: Public
    description: Endpoints for respondents and public results. No authentication.
  - name: Integrations
    description: Server-to-server calls from surveyjs.io. Signed; no session.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Session
  /auth/login:
    get:
      tags: [Session]
      operationId: login
      summary: Start sign-in
      description: |
        Redirects the browser to the configured identity provider. On the hosted
        edition this is `auth.surveyjs.io`, using the OAuth 2.0 authorization code
        flow with PKCE.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: A same-origin path to open after sign-in.
          schema: { type: string, default: /, pattern: '^/' }
        - name: provider
          in: query
          description: >-
            The sign-in method to start. Without it, the default of this instance
            (the sign-in page, or surveyjs.io when that is the only method). A
            method that is not enabled answers `400`.
          schema: { type: string, enum: [surveyjs, google, github, facebook] }
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/callback:
    get:
      tags: [Session]
      operationId: loginCallback
      summary: Finish sign-in
      description: |
        The identity provider redirects here. The server exchanges the code, sets
        the `msid` and `msid_csrf` cookies, and redirects to `returnTo`.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Signed in; redirect back into the application.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The account is blocked (`forbidden`). No session is created.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Sign out
      description: |
        Ends the local session. The response carries the identity provider's
        end-session URL; the client navigates there to sign out everywhere.
        Works without a session too (for example after it expired), so the
        client can still end the provider's session. With a valid session,
        the CSRF token is required.
      security:
        - cookieAuth: []
          csrfToken: []
        - {}
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/password/login:
    post:
      tags: [Session]
      operationId: passwordLogin
      summary: Sign in with email and password
      description: |
        Signs in a local account (`USER_DIRECTORY=local`, `AUTH_METHODS` lists
        `password`). A wrong password and an unknown email get the same answer,
        `401 invalid-credentials`. After 5 failures for one email, further attempts
        are refused for a time that doubles with each failure
        (`429 account-locked`, with `Retry-After`), whether or not the email
        exists. The per-address sign-in rate limit applies too (`429 rate-limited`).
        When the account must change its password first, the session is limited
        to `getCurrentUser` (`mustChangePassword: true`), `changeOwnPassword` and
        `logout`. `501` when password sign-in is not enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
      responses:
        '204':
          description: Signed in; session cookies are set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /auth/password-link:
    post:
      tags: [Session]
      operationId: setPasswordWithLink
      summary: Set a password with a one-time link
      description: |
        Sets the password of a local account from a set-password link: invitations
        and resets (a link works once and for 7 days), and the first admin's setup
        link, which the server writes to its log while the instance has no admin
        (it works once, until the server restarts). The setup link creates that
        admin: `email` and `displayName` are required with it and ignored
        otherwise. An unknown, used or expired link gets `410 link-invalid`. The password must have at least 12 characters and
        not be a common one (`422 password-too-weak`). An account that may sign in
        lands signed in: the answer sets the session cookies. A disabled account's
        password is set, but no session starts. `501` when password sign-in is not
        enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 1, maxLength: 256 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
                email:
                  type: string
                  format: email
                  maxLength: 320
                  description: The first admin's email; required with the setup link.
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: The first admin's name; required with the setup link.
      responses:
        '204':
          description: The password is set; the session cookies too, unless the account is disabled.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ReadOnly' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /me/password:
    post:
      tags: [Session]
      operationId: changeOwnPassword
      summary: Change your password
      description: |
        Changes the signed-in local account's password. The current password must
        be given (`403 invalid-credentials` otherwise); the new one must have at
        least 12 characters and not be a common one (`422 password-too-weak`).
        Every other session of the account ends (it gets `401` within a minute);
        this one is renewed with new session cookies. `501` for an account that is
        not a local one.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password, minLength: 1, maxLength: 1024 }
                newPassword: { type: string, format: password, minLength: 1, maxLength: 1024 }
      responses:
        '204':
          description: The password is changed; new session cookies are set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ReadOnly' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /me:
    get:
      tags: [Session]
      operationId: getCurrentUser
      summary: Current user
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- Config
  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Runtime configuration
      description: Edition, shell, sign-in methods and limits. Safe to cache briefly.
      security: []
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  # --------------------------------------------------------------- Projects
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List the instance's users
      description: |
        Instance admins only (`403 forbidden` otherwise). Every local account, with its
        status, instance role and last sign-in, ordered by email. `501` when the instance
        has no local accounts (`USER_DIRECTORY=local`).
      security:
        - cookieAuth: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user and their set-password link
      description: |
        Instance admins only. Creates an `invited` account and returns its one-time
        set-password link, valid for 7 days: the only time the link is shown. Send it to
        the user yourself; there is no email. The user sets a password with it
        (`setPasswordWithLink`) and becomes `active`. An email that already has an
        account gets `409 email-taken`.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserCreate' }
      responses:
        '201':
          description: Created, with the set-password link.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /admin/users/{userId}:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Change a user's instance role or status
      description: |
        Instance admins only. `status` may be set to `disabled` or `active`: disabling
        ends the user's sessions within a minute; enabling an account that never set a
        password makes it `invited` again. Demoting, disabling or deleting the last
        active instance admin fails with `409 last-instance-admin`, also for yourself.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/AdminUserPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/ReadOnly' }
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and erase their data
      description: |
        Instance admins only. Erases the user's data as the account-deleted webhook does:
        their personal surveys with their results and files go, they leave every project
        (an admin is promoted where none would remain, a project with no other member is
        deleted), then the account is deleted and its sessions end. The last active
        instance admin cannot be deleted (`409 last-instance-admin`).
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /admin/users/{userId}/reset-link:
    parameters:
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [Admin]
      operationId: createUserResetLink
      summary: Reset a user's password
      description: |
        Instance admins only. Clears the user's password, ends their sessions within a
        minute, makes their earlier links unusable, and returns a new one-time
        set-password link, valid for 7 days: the only time it is shown. For an `invited`
        user it is a new invitation link.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '201':
          description: The new set-password link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects the user belongs to
      description: |
        Personal surveys are not a project; see `GET /surveys?project=personal`. With
        `scope=all` an instance admin gets every project of the instance (the ones they
        are not a member of with `role: admin`); others get `403 forbidden`.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: scope
          in: query
          required: false
          description: '`member` (default): the user''s projects; `all`: every project (instance admins).'
          schema: { type: string, enum: [member, all], default: member }
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: The creator becomes the project's first member, as `admin`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /projects/{projectId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Rename a project
      description: Admins only.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Admins only. The project's surveys, archived ones included, with their
        results, files and history, are not deleted. They move to the project owner
        (`ownerId`) as personal surveys (`projectId: null`) and keep their IDs,
        published state and settings; who created each survey does not change.
        When `ownerId` is `null` (the owner has left the project), they move to the
        admin who deletes the project.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # ---------------------------------------------------------------- Members
  /projects/{projectId}/members:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      tags: [Members]
      operationId: listMembers
      summary: List project members
      description: |
        Any member of the project may list its members; for anyone else the
        project does not exist (`404`). Members are ordered by display name,
        ignoring case, then by user ID.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member
      description: |
        Admins only. The email must belong to a registered user; otherwise the
        server returns `404` with code `user-not-found`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '201':
          description: Added.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Members]
      operationId: updateMember
      summary: Change a member's role
      description: |
        Admins only. Demoting the last admin fails with `409 last-admin`, also when
        admins demote themselves. Setting the role a member already has changes
        nothing and answers `200`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MemberPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/MemberPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      description: |
        Admins may remove anyone; any member may remove themselves (leave the
        project). Removing the last admin fails with `409 last-admin`, also when the
        last admin leaves. The only member of a project cannot leave it; they delete
        the project instead.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # ---------------------------------------------------------------- Surveys
  /surveys:
    get:
      tags: [Surveys]
      operationId: listSurveys
      summary: List surveys
      description: Sorted by `updatedAt`, newest first, as on the current site.
      parameters:
        - name: project
          in: query
          description: '`personal`, or the ID of a project the user belongs to.'
          schema: { type: string, default: personal }
        - name: archived
          in: query
          description: '`false` lists active surveys; `true` lists archived ones.'
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of surveys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Surveys]
      operationId: createSurvey
      summary: Create a survey
      description: |
        Without a `name`, the server picks the next free "New Survey N". N is one
        more than the highest number among the active surveys of the target scope
        whose names are `New Survey N`. Without a `definition`, the survey starts
        from the default template. The default template is an empty survey (`{}`).
        A new survey is published: it runs at once, as on surveyjs.io.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /surveys/{surveyId}:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Surveys]
      operationId: getSurvey
      summary: Get a survey record
      responses:
        '200':
          description: The survey record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Surveys]
      operationId: updateSurvey
      summary: Update a survey record
      description: |
        A single call covers rename, move to a project (`projectId`; `null` means
        Personal), archive and restore (`archived`), publish and unpublish
        (`published`), and settings. Requires modify permission; moving also
        requires membership of the target project. Every successful update moves
        `updatedAt`, even when no value changes. Moving sets the caller as the
        survey's creator; `projectId: null` moves the survey to the caller's
        Personal surveys. Moving to the current scope changes nothing but `updatedAt`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SurveyPatch' }
            examples:
              rename: { value: { name: Customer feedback 2026 } }
              publish: { value: { published: true } }
              archive: { value: { archived: true } }
              moveToPersonal: { value: { projectId: null } }
              publicResults: { value: { settings: { publicResults: true } } }
          application/json:
            schema: { $ref: '#/components/schemas/SurveyPatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
    delete:
      tags: [Surveys]
      operationId: deleteSurvey
      summary: Delete a survey permanently
      description: |
        Only archived surveys can be deleted; otherwise `409 survey-not-archived`.
        Deletes the definition, theme, results, files, history and every user's saved results layouts.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /surveys/{surveyId}/clones:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    post:
      tags: [Surveys]
      operationId: cloneSurvey
      summary: Clone a survey
      description: |
        Copies the definition and theme into a new, published, active survey.
        Anyone who can read the source may clone it. The copy goes to the source's
        project (or Personal), unless `projectId` is given (`null` = the caller's
        Personal surveys; a project requires membership). The caller becomes the
        copy's creator. The default name is `Copy of {name}`, cut to 200 characters.
        Results, saved results layouts, history and settings are not copied.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/SurveyName' }
                projectId: { $ref: '#/components/schemas/NullableProjectId' }
      responses:
        '201':
          description: The new survey.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Survey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # --------------------------------------------------------- Survey content
  /surveys/{surveyId}/definition:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Survey content]
      operationId: getSurveyDefinition
      summary: Get the survey definition
      responses:
        '200':
          description: The SurveyJS survey JSON.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/NoTransform' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Survey content]
      operationId: saveSurveyDefinition
      summary: Save the survey definition
      description: |
        Used by Survey Creator auto-save. Also updates `updatedAt` and adds a
        history entry. Send the ETag of your last read or write in `If-Match`
        (`*` matches any version; weak tags never match). Bodies larger than
        `limits.maxDocumentBytes` are rejected with `413`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyDefinition' }
      responses:
        '204':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /surveys/{surveyId}/theme:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Survey content]
      operationId: getSurveyTheme
      summary: Get the survey theme
      responses:
        '200':
          description: The SurveyJS theme JSON; `{}` when the survey uses the default theme.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/NoTransform' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyTheme' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Survey content]
      operationId: saveSurveyTheme
      summary: Save the survey theme
      description: |
        Also updates `updatedAt`. Does not add a history entry. Send the ETag of
        your last read or write in `If-Match` (`*` matches any version; weak tags
        never match). Bodies larger than `limits.maxDocumentBytes` are rejected
        with `413`.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveyTheme' }
      responses:
        '204':
          description: Saved.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # ------------------------------------------------------------------ Files
  /surveys/{surveyId}/assets:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    post:
      tags: [Files]
      operationId: uploadSurveyAsset
      summary: Upload a file from the editor
      description: |
        Images and other files placed into the survey from Survey Creator. Each
        survey has a total quota (see `AppConfig.limits`); exceeding it returns
        `413 quota-exceeded`.

        Send one file as the multipart part `file`. Its type is detected from its
        content (the declared type and the file name are ignored); allowed are PNG,
        JPEG, GIF, WebP, AVIF, BMP and SVG images and MP4, WebM and Ogg videos,
        anything else is `415`. A survey's files count towards
        `limits.maxAssetBytesPerSurvey` until the survey is deleted; an upload that
        would go over it is `413 quota-exceeded`. Copies of a survey get copies of
        its files.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
      responses:
        '201':
          description: Stored. `Location` is the file's download path.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # ---------------------------------------------------------------- History
  /surveys/{surveyId}/history:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [History]
      operationId: listSurveyHistory
      summary: List edits of a survey
      description: |
        Newest first. Every definition save adds an entry, and so do creating a
        survey with a definition and cloning one. `user` is `null` for entries
        recorded without a user (legacy) and for users who no longer exist.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of history entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Results
  /surveys/{surveyId}/results:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Results]
      operationId: listResults
      summary: List responses
      description: |
        Every stored response, oldest first (by `submittedAt`, then `id`). Each stored
        row is one item: responses that one client sent are not merged. The dashboard
        loads every page; there is no 1,000-response cap. For whole-dataset downloads
        use `GET /surveys/{surveyId}/results/export`.

        A cursor belongs to the survey it was returned for: using it for another
        survey is `400 bad-request`.
      parameters:
        - name: limit
          in: query
          description: Page size, 1 to 1000.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of responses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponsePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Results]
      operationId: deleteResults
      summary: Delete all responses
      description: |
        Deletes every response, the completion markers (so "already completed" no longer applies)
        and the files respondents uploaded. Editor assets, saved layouts and settings stay; the
        survey's `updatedAt` does not change. Requires modify permission. Answers `204` also when
        there are no responses. Cannot be undone. `403` means the caller cannot modify the survey,
        or a missing or wrong CSRF token.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /surveys/{surveyId}/results/stats:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Results]
      operationId: getResultStats
      summary: Response statistics
      responses:
        '200':
          description: Totals for the Details tab.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /surveys/{surveyId}/results/export:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Results]
      operationId: exportResults
      summary: Download all responses
      description: |
        Streams every stored response as an attachment, oldest first (by `submittedAt`, then `id`),
        with no 1,000-response cap. Anyone who can see the survey may download it.

        The format comes from `format`, or else from `Accept` by q-value: `application/json`,
        `application/*`, `*/*` or no `Accept` give JSON; `text/csv` or `text/*` give CSV; an `Accept`
        that allows neither is `406 not-acceptable`. A browser link cannot set headers, so it uses
        `format`.

        JSON is an array of `SurveyResponse` items, as `listResults` returns them. CSV is UTF-8 with a
        byte order mark, comma-separated, CRLF line ends and RFC 4180 quoting; its columns are
        described in the API guide (`docs/api/exporting-results.md`). The file is named after the
        survey (`results` when the name is blank).

        The table's own CSV, Excel and PDF export runs in the browser and does not use this endpoint.
      parameters:
        - name: format
          in: query
          description: json or csv; takes precedence over Accept. Any other value is 400 bad-request.
          schema: { type: string, enum: [json, csv] }
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SurveyResponse' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }

  # ------------------------------------------------------------------ Views
  /surveys/{surveyId}/views/{view}:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
      - name: view
        in: path
        required: true
        description: '`summary` (charts) or `table`.'
        schema: { type: string, enum: [summary, table] }
    get:
      tags: [Views]
      operationId: getResultsView
      summary: Get the saved layout
      description: |
        The caller's own saved layout of this view. Layouts are kept per user and
        survey: saving or resetting one changes nothing for other users. Anyone who
        can see the survey may read, save and reset their own layout.

        A server that took over the per-survey layouts of an older system returns
        that layout until the user saves or resets their own.

        `404 not-found`: the survey is unknown or not visible to the caller.
        `404 view-not-found`: no layout is saved, and the default layout is used.
      responses:
        '200':
          description: The saved SurveyJS Dashboard or Table state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ViewState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Views]
      operationId: saveResultsView
      summary: Save the layout
      description: |
        Saves the caller's layout of this view, replacing the previous one or a
        reset. Any JSON object is accepted and stored as sent. Bodies larger than
        `limits.maxResponseBytes` are rejected with `413 payload-too-large`. Saving
        a layout does not change the survey (its `updatedAt` stays). `403` means a
        missing or wrong CSRF token.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ViewState' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '503': { $ref: '#/components/responses/ReadOnly' }
    delete:
      tags: [Views]
      operationId: resetResultsView
      summary: Reset the layout to the default
      description: |
        Deletes the caller's layout of this view. Afterwards `getResultsView` answers
        `404 view-not-found`, also where an older per-survey layout exists, until the
        next save. Resetting a view without a saved layout also answers `204`. `403`
        means a missing or wrong CSRF token.
      security:
        - cookieAuth: []
          csrfToken: []
        - bearerAuth: []
      responses:
        '204': { description: Reset. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ReadOnly' }

  # ----------------------------------------------------------------- Public
  /public/surveys/{surveyId}:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Public]
      operationId: getPublishedSurvey
      summary: Load a published survey
      description: |
        Used by the run page and by embeds. A survey runs while it is published,
        archived or not. An unknown or unpublished survey returns
        `404 survey-not-available`; the two cases are not distinguished.

        "Limit to one response" is on when the returned `definition` has a non-empty
        `cookieName`. The server sets `cookieName` to the survey ID when the survey's
        legacy one-response setting is on and the definition has none.
      security: []
      parameters:
        - name: clientId
          in: query
          description: |
            The respondent's client ID. When given, `completed` tells whether this
            client has already submitted a response (for "Limit to one response").
          schema: { $ref: '#/components/schemas/ClientId' }
      responses:
        '200':
          description: The survey to render.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedSurvey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/surveys/{surveyId}/responses:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    post:
      tags: [Public]
      operationId: submitResponse
      summary: Submit a response
      description: |
        Stores a response to a published survey (archived or not); an unknown or
        unpublished survey is `404 survey-not-available`. The respondent's IP address
        is stored only when the survey's `storeRespondentIp` setting is on.

        When "Limit to one response" is on (see `getPublishedSurvey`) and `clientId`
        has already completed the survey, the server returns `409 already-completed`.
        A request whose `Idempotency-Key` already stored a response answers `201` with
        that response's `id` and stores nothing, even if the client has completed
        since. Two first submissions of one client sent at the same moment may both be
        stored.

        `partial` and `lastPageIndex` are ignored in Phase 1: the response is stored
        as complete. A server may refuse answers its storage cannot hold with
        `413 payload-too-large`, even below `limits.maxResponseBytes`.
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseSubmission' }
      responses:
        '201':
          description: Stored, or already stored under this `Idempotency-Key` (same `id`).
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /public/surveys/{surveyId}/files:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    post:
      tags: [Public]
      operationId: uploadResponseFile
      summary: Upload a respondent file
      description: |
        Files from File Upload and Signature questions are stored as blobs, and the
        response keeps only the returned URL. This lifts the 64 KB response limit.

        Send one file as the multipart part `file`, up to `limits.maxFileBytes`
        (`413 payload-too-large` above). Any type is accepted: the type is detected
        from the content, and a file that is not one of the image or video types of
        `downloadFile` is stored and served as `application/octet-stream`. The survey
        must be published, as for `submitResponse`. Files stay until the survey is
        deleted.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/FileUpload' }
      responses:
        '201':
          description: Stored. `Location` is the file's download path.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ReadOnly' }
  /public/files/{fileId}:
    parameters:
      - name: fileId
        in: path
        required: true
        description: |
          An unguessable ID with at least 128 bits of randomness; the URL itself
          grants access. Signed, expiring URLs are a possible P1 hardening.
        schema: { type: string }
    get:
      tags: [Public]
      operationId: downloadFile
      summary: Download a stored file
      description: |
        Public: the unguessable URL is the permission. Images are served `inline`,
        other files as `attachment`. Respondent files of other types are served as
        `application/octet-stream`. Deleting the survey deletes its files (`404`
        afterwards; caches may keep a copy for up to an hour).
      security: []
      responses:
        '200':
          description: The file content.
          headers:
            Content-Disposition:
              description: '`inline` for images, else `attachment`, with `filename` and `filename*`.'
              required: true
              schema: { type: string, pattern: '^(inline|attachment); ' }
            Cache-Control:
              description: Public, cacheable for up to an hour.
              required: true
              schema: { type: string }
            X-Content-Type-Options:
              description: Always `nosniff`; the served type matches the content.
              required: true
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              description: A sandboxing policy, so a file opened directly runs no script.
              required: true
              schema: { type: string }
            Cross-Origin-Resource-Policy:
              description: Always `cross-origin`, so surveys embedded on other sites show the files.
              required: true
              schema: { type: string, enum: [cross-origin] }
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/gif:
              schema: { type: string, contentMediaType: image/gif }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            image/avif:
              schema: { type: string, contentMediaType: image/avif }
            image/bmp:
              schema: { type: string, contentMediaType: image/bmp }
            image/svg+xml:
              schema: { type: string, contentMediaType: image/svg+xml }
            video/mp4:
              schema: { type: string, contentMediaType: video/mp4 }
            video/webm:
              schema: { type: string, contentMediaType: video/webm }
            video/ogg:
              schema: { type: string, contentMediaType: video/ogg }
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/surveys/{surveyId}/results:
    parameters:
      - { $ref: '#/components/parameters/SurveyId' }
    get:
      tags: [Public]
      operationId: getPublicResults
      summary: Public results
      description: |
        Public: no sign-in. Available only while the survey's `publicResults` setting is on
        ("Grant Access"), whether or not the survey is published or archived; otherwise
        `404 survey-not-available`, the same answer as for an unknown survey.

        Every stored response, oldest first, paged as `listResults` (a cursor belongs to its
        survey). The cursor carries the last item's submission time and response id: it is opaque
        to clients, and response ids are random. Items carry `submittedAt` and `data` only: no id,
        client id or IP address. The answers and comments of the questions in `settings.privateResultQuestions` are left out;
        `survey.privateQuestions` names them. Each page includes the survey definition so a
        dashboard can render it.

        In P1 this is complemented by token-based shareable reports.
      security: []
      parameters:
        - name: limit
          in: query
          description: Page size, 1 to 1000.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: A page of responses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicResultPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ----------------------------------------------------------- Integrations
  /webhooks/account-deleted:
    post:
      tags: [Integrations]
      operationId: receiveAccountDeleted
      summary: Erase the data of a deleted surveyjs.io account
      description: |
        Called by surveyjs.io when a user deletes their account. The server erases the user's
        personal surveys with their results and files, and removes the user from every project.
        A project whose last admin is erased passes to its next member (by display name), who
        becomes an admin; a project without another member is deleted with its surveys. Other
        project surveys stay. The server trusts the signed message: it does not ask the user
        directory whether the account is gone.

        The call has no session. It is signed as Standard Webhooks (standardwebhooks.com)
        describes, with the secret the server is configured with: `webhook-signature` holds `v1,`
        and the base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{body}`. A missing or wrong
        signature, or a timestamp more than five minutes from the server clock, fails with
        `401 invalid-signature` before the body is read. A server without a webhook secret answers
        `404` (`503 read-only` while `READ_ONLY=true`, which refuses every call before the
        signature is checked).

        `204` means the erasure is finished. Repeating a call is harmless: the second erasure finds
        nothing. Events of another `type` answer `204` and change nothing.
      security: []
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: The message ID; a retry sends the same ID.
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: webhook-timestamp
          in: header
          required: true
          description: When the message was sent, in Unix seconds.
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: webhook-signature
          in: header
          required: true
          description: 'Space-separated signatures, each `v1,` and a base64 HMAC-SHA256.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountDeletedEvent' }
      responses:
        '204':
          description: The account's data is erased, or the event was ignored.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidSignature' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '503': { $ref: '#/components/responses/ReadOnly' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: msid
      description: Session cookie (HttpOnly, Secure, SameSite=Lax), set on sign-in.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the value of the readable `msid_csrf` cookie. Required with `cookieAuth` on requests that change data.
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-project API token, sent as `Authorization Bearer <token>`.
      x-phase: P1

  parameters:
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` value from the previous page.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read or write of this document.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A client-generated unique key (UUID recommended). A repeated key for the same survey
        returns the original response's `id` and stores nothing. Keys are remembered for at least 24 hours.
      schema: { type: string, minLength: 1, maxLength: 128 }

  headers:
    Location:
      description: URL of the created resource or redirect target.
      schema: { type: string }
    ETag:
      description: Strong, opaque version tag of the document; send it back in `If-Match`.
      required: true
      schema: { type: string }
    NoTransform:
      description: |
        Always `no-transform`: a proxy must not compress the document, because compressing
        proxies rewrite the `ETag` (Caddy turns `"v"` into `"v-zstd"`), and the rewritten
        tag never matches in `If-Match`.
      required: true
      schema: { type: string, enum: [no-transform] }
    SetCookie:
      description: Session cookies `msid` (HttpOnly) and `msid_csrf` (readable).
      schema: { type: string }
    ContentDisposition:
      description: '`attachment; filename="…"; filename*=UTF-8''''…`: the ASCII fallback, then the UTF-8 name.'
      required: true
      schema: { type: string, pattern: '^attachment; filename="[^"]*"; filename\*=UTF-8''''' }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: >-
        Not signed in, or the credentials are invalid (`unauthenticated`,
        `invalid-credentials`), or the session must change its password first
        (`password-change-required`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/unauthenticated
            title: Sign-in required
            status: 401
            code: unauthenticated
    InvalidSignature:
      description: The webhook signature is missing, wrong, or older than five minutes (`invalid-signature`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/invalid-signature
            title: Invalid signature
            status: 401
            code: invalid-signature
    Forbidden:
      description: Signed in but not allowed (`forbidden`, `csrf-token-invalid`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/forbidden
            title: You cannot modify this survey
            status: 403
            code: forbidden
    NotFound:
      description: |
        The resource does not exist or is not visible to the caller. Codes:
        `not-found`, `survey-not-available`, `user-not-found`, `view-not-found`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/survey-not-available
            title: This survey is not available
            status: 404
            code: survey-not-available
    Conflict:
      description: |
        The request conflicts with the current state. Codes:
        `survey-not-archived`, `already-member`, `last-admin`, `already-completed`, `email-taken`,
        `last-instance-admin`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/survey-not-archived
            title: Archive the survey before deleting it
            status: 409
            code: survey-not-archived
    Gone:
      description: The link was used, has expired, or was never issued (`link-invalid`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/link-invalid
            title: Link not valid
            status: 410
            code: link-invalid
    PreconditionFailed:
      description: The document changed since it was read (`edit-conflict`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/edit-conflict
            title: The survey was changed by someone else
            status: 412
            code: edit-conflict
            detail: Reload the survey to see the latest version.
    PreconditionRequired:
      description: The write did not send `If-Match` (`if-match-required`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: The body or file is too large, or a quota is used up (`payload-too-large`, `quota-exceeded`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/quota-exceeded
            title: File quota exceeded
            status: 413
            code: quota-exceeded
            detail: This survey can store up to 50 MB of files.
    UnsupportedMediaType:
      description: The file type is not allowed (`unsupported-media-type`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotAcceptable:
      description: The requested download format is not supported (`not-acceptable`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The body is well-formed but invalid (`validation-failed`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/validation-failed
            title: The request is invalid
            status: 422
            code: validation-failed
            errors:
              - pointer: /name
                detail: Must not be empty.
    TooManyRequests:
      description: Rate limit reached (`rate-limited`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotImplemented:
      description: The operation belongs to a later phase (`not-implemented`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ReadOnly:
      description: |
        The server runs read-only (`read-only`): it refuses every write before reading the
        request, whoever sends it. Reads, sign-in and sign-out keep working. `AppConfig.readOnly`
        says so in advance.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://studio.surveyjs.io/problems/read-only
            title: My Surveys is read-only at the moment. Changes cannot be saved.
            status: 503
            code: read-only

  schemas:
    # ------------------------------------------------------------- Basics
    Id:
      type: string
      description: Opaque identifier. Existing surveyjs.io IDs are GUIDs.
      minLength: 1
      maxLength: 64
      examples: [f6f1c966-8d49-46d0-94d3-975c53b6577d]
    NullableProjectId:
      description: A project ID, or `null` for Personal.
      oneOf:
        - { $ref: '#/components/schemas/Id' }
        - { type: 'null' }
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-05T06:48:39.795Z']
    ClientId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^/\\#?\u0000-\u001F\u007F-\u009F]+$'
      description: Identifies a respondent's device or account, for one-response limits. Must not
        contain `/`, `\`, `#`, `?` or control characters.
    Cursor:
      type: [string, 'null']
      description: Pass as `cursor` to fetch the next page; `null` on the last page.

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: >-
            Stable machine-readable error code. `internal-error` is used for
            unexpected server errors (`500`).
          enum:
            - bad-request
            - unauthenticated
            - invalid-signature
            - forbidden
            - csrf-token-invalid
            - not-found
            - survey-not-available
            - user-not-found
            - view-not-found
            - survey-not-archived
            - already-member
            - last-admin
            - already-completed
            - edit-conflict
            - if-match-required
            - payload-too-large
            - quota-exceeded
            - unsupported-media-type
            - not-acceptable
            - validation-failed
            - rate-limited
            - not-implemented
            - read-only
            - invalid-credentials
            - account-locked
            - password-too-weak
            - password-change-required
            - link-invalid
            - email-taken
            - last-instance-admin
            - internal-error
        errors:
          type: array
          description: Present for `validation-failed`.
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: { type: string, description: JSON Pointer to the invalid field. }
              detail: { type: string }

    # ------------------------------------------------------------ Admin
    AdminUser:
      type: object
      required: [id, email, displayName, instanceRole, status, createdAt, lastSignInAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        displayName: { type: string }
        instanceRole: { $ref: '#/components/schemas/InstanceRole' }
        status:
          type: string
          enum: [invited, active, disabled]
          description: '`invited` until the user sets a password with their link.'
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastSignInAt:
          description: The last password sign-in; `null` before the first.
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
      examples:
        - id: 3c4a7fdf-94a1-41ec-96d0-41749c260100
          email: alex@example.com
          displayName: Alex
          instanceRole: user
          status: active
          createdAt: '2026-10-29T10:00:00.000Z'
          lastSignInAt: '2026-10-30T08:15:00.000Z'
    AdminUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }
    AdminUserCreate:
      type: object
      required: [email, displayName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, minLength: 1, maxLength: 128 }
        instanceRole: { $ref: '#/components/schemas/InstanceRole', default: user }
    AdminUserPatch:
      type: object
      minProperties: 1
      properties:
        instanceRole: { $ref: '#/components/schemas/InstanceRole' }
        status:
          type: string
          enum: [active, disabled]
    InstanceRole:
      type: string
      enum: [admin, user]
      description: '`admin` manages the instance''s users and every project.'
    PasswordLink:
      type: object
      required: [url, expiresAt]
      description: A one-time set-password link. Only this answer shows it; the server keeps a hash.
      properties:
        url:
          type: string
          format: uri
          description: '`PUBLIC_BASE_URL/set-password?token=…`, to send to the user.'
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - url: https://studio.example.com/set-password?token=7cJ2rQ0wUu8xXnYk3fVb1A
          expiresAt: '2026-11-05T10:00:00.000Z'
    CreatedUser:
      type: object
      required: [user, link]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        link: { $ref: '#/components/schemas/PasswordLink' }

    # ------------------------------------------------------------ Session
    CurrentUser:
      type: object
      required: [id, displayName, email]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: [string, 'null'], format: uri }
        instanceRole:
          $ref: '#/components/schemas/InstanceRole'
          description: A local account's role on this instance (`USER_DIRECTORY=local`); absent otherwise.
        mustChangePassword:
          type: boolean
          description: >-
            A local account that must change its password before anything else; the
            session then answers `401 password-change-required` to other operations.
        notices:
          type: array
          description: Account notices shown by the shell, such as licence expiry on the hosted edition.
          items: { $ref: '#/components/schemas/Notice' }
      examples:
        - id: 3c4a7fdf-94a1-41ec-96d0-41749c260100
          displayName: Alex
          email: alex@example.com
          avatarUrl: null
          notices: []
    Notice:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [license-expired, license-expires-soon] }
        message: { type: string }
        actionUrl: { type: string, format: uri }
        actionLabel: { type: string }

    AppConfig:
      type: object
      required: [edition, shell, authMethods, limits, readOnly, branding, features]
      properties:
        edition:
          type: string
          enum: [hosted, self-hosted]
        shell:
          type: string
          description: |
            The look-and-feel shell: `surveyjs-site` reproduces surveyjs.io; `self-hosted` is the
            self-hosted look, with the instance's branding and "Powered by SurveyJS".
          examples: [surveyjs-site, self-hosted]
        authMethods:
          type: array
          description: |
            The sign-in methods: `surveyjs` (surveyjs.io accounts), `password` (local accounts), or an
            OAuth2 provider (`google`, `github`, `facebook`). This version offers `surveyjs` only; the
            others come with local accounts.
          items: { type: string, enum: [surveyjs, password, google, github, facebook] }
        surveyjsLicenseKey:
          type: [string, 'null']
          description: |
            Licence key for the commercial SurveyJS components (Creator,
            Dashboard, PDF), applied by the front-end at start-up. It is public by
            nature, like any licence key shipped in a front-end bundle.
        limits:
          type: object
          required: [maxAssetBytesPerSurvey, maxFileBytes, maxResponseBytes, maxDocumentBytes]
          properties:
            maxAssetBytesPerSurvey:
              type: integer
              description: Total bytes of editor uploads one survey may hold.
            maxFileBytes:
              type: integer
              description: Largest respondent file, in bytes.
            maxResponseBytes:
              type: integer
              description: Largest response body, in bytes.
            maxDocumentBytes:
              type: integer
              description: Largest survey definition or theme body accepted, in bytes.
        readOnly:
          type: boolean
          description: |
            True while the server refuses every write with `503 read-only` (`READ_ONLY=true`); the
            front-end shows a banner and opens the editor read-only.
        links:
          type: object
          description: Shell links, such as account settings and help desk.
          additionalProperties: { type: string, format: uri }
        branding: { $ref: '#/components/schemas/Branding' }
        features: { $ref: '#/components/schemas/Features' }
    Branding:
      type: object
      description: The instance's branding, shown by the `self-hosted` shell.
      required: [name, logoUrl, accentColor, termsUrl, privacyUrl, poweredBy]
      properties:
        name: { type: string, description: The instance's name (`BRAND_NAME`). }
        logoUrl:
          type: [string, 'null']
          description: An https URL or a path on this site (`BRAND_LOGO_URL`); `null` for none.
        accentColor:
          type: string
          pattern: '^#(?:[0-9a-f]{3}|[0-9a-f]{6})$'
          description: The accent colour (`BRAND_ACCENT_COLOR`).
        termsUrl: { type: [string, 'null'], format: uri }
        privacyUrl: { type: [string, 'null'], format: uri }
        poweredBy:
          type: boolean
          description: |
            Whether "Powered by SurveyJS" shows. `BRANDING=off` hides it, and needs the
            instance's own SurveyJS licence key; the SurveyJS libraries decide what a key allows.
    Features:
      type: object
      description: |
        What the shell offers. The Embed tab, the API docs and API tokens are shown only in the
        `surveyjs-site` shell; elsewhere `/api/docs` answers `404`.
      required: [embed, apiDocs, apiTokens]
      properties:
        embed: { type: boolean, description: The editor's Embed Survey and Embed Creator tabs. }
        apiDocs: { type: boolean, description: The API reference at `/api/docs`. }
        apiTokens: { type: boolean, description: The API tokens page (hosted track). }

    # ----------------------------------------------------------- Projects
    ProjectRole:
      type: string
      enum: [admin, user]
    Project:
      type: object
      required: [id, name, ownerId, role, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { $ref: '#/components/schemas/ProjectName' }
        ownerId:
          description: |
            The user who created the project, while they are still a member. `null` once the creator has
            left the project, or when the store no longer knows who created it (for example after the
            creator's role was changed in another application). Receives the project's surveys when the
            project is deleted; when `null`, the admin who deletes the project receives them.
          oneOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        role:
          $ref: '#/components/schemas/ProjectRole'
          description: |
            The current user's role in this project. An instance admin gets `admin` on every
            project, a member or not: they may use every admin action on it.
        memberCount: { type: integer, minimum: 1 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - id: 56ddd87e-e091-47cd-8edb-4843ee17829c
          name: JaneOrg.com
          ownerId: 112454ae-dedf-4c74-be5c-4b4d4f92dabe
          role: user
          memberCount: 2
          createdAt: '2023-11-21T10:00:00Z'
    ProjectName:
      type: string
      minLength: 1
      maxLength: 128
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/ProjectName' }
    ProjectPatch:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/ProjectName' }
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    Member:
      type: object
      required: [userId, displayName, email, role]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/ProjectRole' }
    MemberCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role:
          $ref: '#/components/schemas/ProjectRole'
          default: user
    MemberPatch:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    MemberPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    # ------------------------------------------------------------ Surveys
    SurveyName:
      type: string
      minLength: 1
      maxLength: 200
    SurveySettings:
      type: object
      properties:
        publicResults:
          type: boolean
          description: '"Grant Access": results are readable at `/public/surveys/{surveyId}/results`.'
        storeRespondentIp:
          type: boolean
          description: '"Save Respondent IP in Results".'
        privateResultQuestions:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
          description: |
            Names of the questions hidden from public results: `getPublicResults` leaves their answers
            (and comments) out, and the public dashboard does not show them. Empty means every question
            is public. A patch replaces the whole list. `getSurvey`, `updateSurvey`, `createSurvey` and
            `cloneSurvey` return it; `listSurveys` items leave it out. On `getSurvey` and `updateSurvey`
            it is absent when the list cannot be read right now: a client must then not offer to
            change it, as a list built from an unknown state could make private questions public.
    Survey:
      type: object
      required:
        - id
        - name
        - projectId
        - published
        - archived
        - createdAt
        - updatedAt
        - postId
        - resultId
        - permissions
        - settings
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name:
          type: string
          maxLength: 200
          description: May be empty for legacy records.
        projectId: { $ref: '#/components/schemas/NullableProjectId' }
        published:
          type: boolean
          description: |
            Whether the survey runs. False only after Unpublish: a new survey, and a legacy
            survey whose flag was never set, is published.
        archived: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        postId:
          $ref: '#/components/schemas/Id'
          description: Legacy ID shown by "Copy Post ID"; used by api.surveyjs.io clients.
        resultId:
          $ref: '#/components/schemas/Id'
          description: Legacy ID shown by "Copy Result ID"; used by api.surveyjs.io clients.
        permissions:
          type: object
          required: [canModify]
          properties:
            canModify: { type: boolean }
        settings:
          allOf:
            - { $ref: '#/components/schemas/SurveySettings' }
            - required: [publicResults, storeRespondentIp]
      examples:
        - id: f6f1c966-8d49-46d0-94d3-975c53b6577d
          name: Customer feedback
          projectId: null
          published: true
          archived: false
          createdAt: '2023-03-13T09:12:00Z'
          updatedAt: '2026-04-14T15:30:00Z'
          postId: 13f2e886-9c38-42f2-b814-d0900cf06a19
          resultId: 929d229c-9f78-40ec-aa47-0eea718a53b2
          permissions: { canModify: true }
          settings: { publicResults: false, storeRespondentIp: false }
    SurveyCreate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/SurveyName' }
        projectId: { $ref: '#/components/schemas/NullableProjectId' }
        definition: { $ref: '#/components/schemas/SurveyDefinition' }
    SurveyPatch:
      type: object
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/SurveyName' }
        projectId: { $ref: '#/components/schemas/NullableProjectId' }
        archived: { type: boolean }
        published: { type: boolean }
        settings: { $ref: '#/components/schemas/SurveySettings' }
    SurveyPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Survey' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    SurveyDefinition:
      type: object
      description: |
        A SurveyJS survey JSON schema, stored as the client sends it. See
        https://surveyjs.io/form-library/documentation/design-survey/create-a-simple-survey
      additionalProperties: true
      examples:
        - title: Customer feedback
          pages:
            - name: page1
              elements:
                - { type: rating, name: satisfaction, title: How satisfied are you? }
    SurveyTheme:
      type: object
      description: A SurveyJS theme JSON (`themeName`, `colorPalette`, `cssVariables`, …).
      additionalProperties: true

    # -------------------------------------------------------------- Files
    FileUpload:
      type: object
      description: One file in the multipart part `file`.
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
    StoredFile:
      type: object
      required: [id, url, name, contentType, size]
      properties:
        id:
          type: string
          description: Opaque; at least 128 bits of randomness.
        url:
          type: string
          description: Absolute URL of `GET /public/files/{fileId}`; this is what goes into the survey JSON or response.
        name:
          type: string
          description: The uploaded file name, without any folder part.
        contentType:
          type: string
          description: Detected from the file's content.
        size:
          type: integer
          minimum: 0
          description: Bytes.

    # ------------------------------------------------------------ History
    HistoryEntry:
      type: object
      required: [at, user]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        user:
          description: Who saved. `null` for legacy entries recorded without a user.
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                displayName: { type: string }
            - { type: 'null' }
    HistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }

    # ------------------------------------------------------------ Results
    SurveyResponse:
      type: object
      required: [id, submittedAt, data]
      properties:
        id: { type: string, description: 'Legacy `InstanceId`.' }
        submittedAt: { $ref: '#/components/schemas/Timestamp' }
        data:
          type: object
          description: The respondent's answers keyed by question name, as produced by the Form Library.
          additionalProperties: true
        clientId:
          type: string
          description: The client id sent with the response, as stored. Responses stored by an
            older system may hold any string.
        respondentIp:
          type: string
          description: Present only when `storeRespondentIp` was on at submission time.
        partial:
          type: boolean
          description: A partial save from an older client. Not returned in Phase 1.
          x-phase: P1
      examples:
        - id: eb2ed53e-f1ee-4343-a7d4-371d1d689dca
          submittedAt: '2026-10-05T06:48:57.517Z'
          data: { satisfaction: 4, comment: Great service }
    ResponsePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SurveyResponse' } }
        nextCursor: { $ref: '#/components/schemas/Cursor' }
    ResultStats:
      type: object
      required: [count, firstSubmittedAt, lastSubmittedAt]
      properties:
        count: { type: integer, minimum: 0, description: Stored responses. }
        firstSubmittedAt:
          { type: [string, 'null'], format: date-time, description: '`null` when there are none.' }
        lastSubmittedAt:
          { type: [string, 'null'], format: date-time, description: '`null` when there are none.' }
    ViewState:
      type: object
      description: Opaque state from SurveyJS Dashboard (`summary`) or Table (`table`).
      additionalProperties: true

    # ------------------------------------------------------------- Public
    PublishedSurvey:
      type: object
      required: [id, name, definition, theme]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 200, description: May be empty for legacy records. }
        definition: { $ref: '#/components/schemas/SurveyDefinition' }
        theme: { $ref: '#/components/schemas/SurveyTheme' }
        completed:
          type: boolean
          description: Present when `clientId` was given.
    ResponseSubmission:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        clientId: { $ref: '#/components/schemas/ClientId' }
        partial:
          type: boolean
          default: false
          description: 'Save progress without completing. Ignored in Phase 1: the response is stored as complete.'
          x-phase: P1
        lastPageIndex:
          type: integer
          minimum: 0
          description: Page to resume on. Ignored in Phase 1.
          x-phase: P1
    PublicResultPage:
      type: object
      required: [survey, items, nextCursor]
      properties:
        survey:
          type: object
          required: [id, name, definition]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name:
              type: string
              maxLength: 200
              description: May be empty for legacy records.
            definition: { $ref: '#/components/schemas/SurveyDefinition' }
            privateQuestions:
              type: array
              items: { type: string }
              description: "The survey's settings.privateResultQuestions: their answers are left out of items, and a dashboard hides them."
        items:
          type: array
          items:
            type: object
            required: [submittedAt, data]
            properties:
              submittedAt: { $ref: '#/components/schemas/Timestamp' }
              data: { type: object, additionalProperties: true }
        nextCursor: { $ref: '#/components/schemas/Cursor' }
    AccountDeletedEvent:
      type: object
      required: [type, data]
      description: An account event of surveyjs.io. Only `account.deleted` is acted on.
      properties:
        type:
          type: string
          description: '`account.deleted`. Events of other types are accepted and ignored.'
          examples: [account.deleted]
        data:
          type: object
          required: [userId]
          properties:
            userId: { $ref: '#/components/schemas/Id' }
