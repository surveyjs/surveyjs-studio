packages:
  - contract
  - server
  - web
  - conformance-tests
  - e2e

allowBuilds:
  esbuild: true
  # core-js only prints a donation banner in its postinstall; not needed.
  core-js: false
  # msw only copies the browser service worker in its postinstall; the tests use msw/node.
  msw: false
  # sass only uses @parcel/watcher for its CLI --watch mode; Vite compiles without it.
  "@parcel/watcher": false

# SurveyJS 3.2.5 was installed the day after its release (2026-11-11), inside pnpm's minimum release
# age. Remove these lines once that age has passed; nothing else needs them.
minimumReleaseAgeExclude:
  - survey-analytics@3.2.5
  - survey-core@3.2.5
  - survey-creator-core@3.2.5
  - survey-creator-react@3.2.5
  - survey-react-ui@3.2.5

peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares typescript ^5 but works with 6 (it only uses the TS compiler API).
    "openapi-typescript>typescript": "6"

permissions:
  "@tanstack/router-plugin":
    skills: false
