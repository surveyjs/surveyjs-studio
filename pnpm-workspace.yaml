packages:
  - contract
  - server
  - web
  - conformance-tests
  - e2e

allowBuilds:
  esbuild: true
  # core-js only prints a donation banner in its postinstall; not needed.
  core-js: false
  # msw only copies the browser service worker in its postinstall; the tests use msw/node.
  msw: false
  # sass only uses @parcel/watcher for its CLI --watch mode; Vite compiles without it.
  "@parcel/watcher": false

# The SurveyJS packages are taken as soon as they are released, without pnpm's minimum release age
# (as in renovate.json): the app follows SurveyJS's own releases.
minimumReleaseAgeExclude:
  - survey-analytics
  - survey-core
  - survey-creator-core
  - survey-creator-react
  - survey-react-ui

peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares typescript ^5 but works with 6 (it only uses the TS compiler API).
    "openapi-typescript>typescript": "6"

permissions:
  "@tanstack/router-plugin":
    skills: false
